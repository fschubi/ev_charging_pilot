# EV Charging Pilot – Standard-Dashboard aus HA-Bordmitteln (Masterplan §12.5, v0.2)
#
# Einbinden: Einstellungen → Dashboards → Dashboard hinzufügen → „Neu von Grund auf“,
# dann ⋮ → Rohdaten-Konfigurationseditor → diesen Inhalt einfügen.
# Karten für OVMS-Werte (SOC, Klima) erscheinen erst, wenn die Entitäten existieren.
title: EV Charging Pilot
views:
  - title: Cockpit
    path: ev-pilot
    icon: mdi:car-electric
    cards:
      - type: tile
        entity: sensor.ev_pilot_executor_state
        name: Status
      - type: glance
        title: Überblick
        entities:
          - entity: sensor.ev_pilot_soc
          - entity: sensor.ev_pilot_charge_power
          - entity: sensor.ev_pilot_session_energy
          - entity: sensor.ev_pilot_system_health
      - type: entities
        title: Plan und Prognose
        entities:
          - sensor.ev_pilot_desired_reason
          - sensor.ev_pilot_next_charge_start
          - sensor.ev_pilot_next_departure
          - sensor.ev_pilot_expected_departure_soc
          - sensor.ev_pilot_estimated_finish
          - binary_sensor.ev_pilot_charge_plan_feasible
          - binary_sensor.ev_pilot_manual_override
          - sensor.ev_pilot_last_charge_result
      - type: entities
        title: Bedienung
        entities:
          - switch.ev_pilot_automation
          - switch.ev_pilot_dry_run
          - select.ev_pilot_override_mode
          - time.ev_pilot_departure
          - number.ev_pilot_minimum_departure_soc
          - number.ev_pilot_preferred_departure_soc
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            entity: button.ev_pilot_start_charge
            name: Jetzt laden
            icon: mdi:play
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.ev_pilot_start_charge}}
          - type: button
            entity: button.ev_pilot_stop_charge
            name: Stopp
            icon: mdi:stop
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.ev_pilot_stop_charge}}
          - type: button
            entity: button.ev_pilot_one_shot_tonight
            name: Heute Nacht
            icon: mdi:weather-night
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.ev_pilot_one_shot_tonight}}
          - type: button
            entity: button.ev_pilot_climate_10min
            name: Klima 10 min
            icon: mdi:fan
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.ev_pilot_climate_10min}}
          - type: button
            entity: button.ev_pilot_climate_stop
            name: Klima stopp
            icon: mdi:fan-off
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.ev_pilot_climate_stop}}
          - type: button
            entity: button.ev_pilot_reset_error
            name: Fehler zurücksetzen
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: button.press
              target: {entity_id: button.ev_pilot_reset_error}
              confirmation: {text: "Fehlerzustand zurücksetzen?"}
      - type: history-graph
        title: Ladeleistung und SOC (24 h)
        hours_to_show: 24
        entities:
          - sensor.ev_pilot_charge_power
          - sensor.ev_pilot_soc
  - title: Hausstrom
    path: ev-pilot-energy
    icon: mdi:home-lightning-bolt
    cards:
      - type: entities
        title: Dieser Monat
        entities:
          - sensor.ev_pilot_month_home_energy
          - sensor.ev_pilot_month_cost
          - sensor.ev_pilot_month_external_energy
          - sensor.ev_pilot_month_distance
          - sensor.ev_pilot_month_cost_per_100km
          - sensor.ev_pilot_month_grid_consumption
      - type: entities
        title: Dieses Jahr
        entities:
          - sensor.ev_pilot_year_home_energy
          - sensor.ev_pilot_year_cost
          - sensor.ev_pilot_year_external_energy
          - sensor.ev_pilot_year_distance
          - sensor.ev_pilot_year_cost_per_100km
          - sensor.ev_pilot_year_grid_consumption
      - type: statistics-graph
        title: Heimladen pro Monat
        entities: [sensor.ev_pilot_home_energy_total]
        stat_types: [change]
        period: month
        chart_type: bar
        days_to_show: 365
  - title: Diagnose
    path: ev-pilot-diagnose
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Gesundheit
        entities:
          - sensor.ev_pilot_system_health
          - binary_sensor.ev_pilot_charge_problem
          - binary_sensor.ev_pilot_cp_failsafe_ok
          - binary_sensor.ev_pilot_charger_available
          - binary_sensor.ev_pilot_vehicle_available
          - binary_sensor.ev_pilot_data_conflict
          - binary_sensor.ev_pilot_soc_stale
          - binary_sensor.ev_pilot_hvcycle_warning
          - sensor.ev_pilot_hv_contactor_cycles
          - sensor.ev_pilot_last_event
      - type: logbook
        title: Ereignisse
        hours_to_show: 48
        entities:
          - sensor.ev_pilot_executor_state
          - sensor.ev_pilot_last_event
