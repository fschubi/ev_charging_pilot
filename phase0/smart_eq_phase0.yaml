# Smart EQ 453 Charging Center – Phase 0 (Automation + Messphase, Masterplan §15)
#
# Als HA-Package einbinden (configuration.yaml):
#   homeassistant:
#     packages:
#       smart_eq_phase0: !include packages/smart_eq_phase0.yaml
#
# Vor dem Einbinden ersetzen:
#   * SHELLY_IP            → IP des Shelly 1 Mini (zwei Stellen unten)
#   * notify.DEIN_HANDY    → eigenes Push-Ziel, z. B. notify.mobile_app_iphone
#   * Entity-IDs prüfen (Masterplan §2), falls sie bei dir anders heißen.
#
# Voraussetzungen:
#   * evcc steuert die Halo nicht mehr (Grundsatz 1), Halo-Zeitplan aus.
#   * CP-Puls erst aktivieren (input_boolean.smart_eq_p0_cp_wakeup), wenn die
#     Checkliste aus §3.6 abgehakt ist.
#
# Recorder: Halo- und Shelly-Entities dürfen nicht per `exclude` ausgeschlossen
# sein; HA speichert dann jeden Zustandswechsel in voller Auflösung. Daraus
# erzeugt tools/export_replay.py die Replay-Datensätze für v0.1.
#
# Sobald die Integration live schaltet (v0.3), dieses Package entfernen –
# sonst schalten zwei Systeme die Halo.

# ---------------------------------------------------------------------------
# Hausabrechnung ab Tag 1 (§10.1)
# ---------------------------------------------------------------------------
utility_meter:
  smart_eq_home_energy_month:
    name: Smart EQ Heimladen Monat
    source: sensor.halo_wallbox_total_energy
    cycle: monthly
  smart_eq_home_energy_year:
    name: Smart EQ Heimladen Jahr
    source: sensor.halo_wallbox_total_energy
    cycle: yearly

# ---------------------------------------------------------------------------
# Bedienung
# ---------------------------------------------------------------------------
input_datetime:
  smart_eq_p0_start:
    name: Smart EQ Ladestart (Phase 0)
    has_date: false
    has_time: true
    initial: "03:00:00"
  smart_eq_p0_end:
    name: Smart EQ Halo aus (Phase 0)
    has_date: false
    has_time: true
    initial: "06:00:00"

input_boolean:
  smart_eq_p0_enabled:
    name: Smart EQ Phase-0-Automatik
    icon: mdi:car-electric
  smart_eq_p0_cp_wakeup:
    name: Smart EQ CP-Wakeup erlaubt (Checkliste §3.6 erledigt)
    icon: mdi:pulse

input_number:
  smart_eq_p0_start_wait:
    name: Smart EQ Wartezeit bis Wakeup
    min: 30
    max: 600
    step: 10
    initial: 120
    unit_of_measurement: s
  smart_eq_p0_post_cp_wait:
    name: Smart EQ Wartezeit nach CP-Puls
    min: 30
    max: 600
    step: 10
    initial: 90
    unit_of_measurement: s

# ---------------------------------------------------------------------------
# Shelly-RPC: Puls mit toggle_after (§3.1) und Config-Abfrage
# ---------------------------------------------------------------------------
rest_command:
  smart_eq_cp_pulse:
    url: "http://SHELLY_IP/rpc/Switch.Set?id=0&on=false&toggle_after={{ seconds | default(10) | int }}"
    method: get
    timeout: 5
  smart_eq_shelly_config:
    url: "http://SHELLY_IP/rpc/Switch.GetConfig?id=0"
    method: get
    timeout: 5

# ---------------------------------------------------------------------------
# Nachtladung: Halo an → Leistung prüfen → sonst CP-Puls → prüfen → Push
# ---------------------------------------------------------------------------
script:
  smart_eq_p0_start_charge:
    alias: "Smart EQ P0: Ladestart mit Wakeup"
    icon: mdi:battery-charging
    mode: single
    variables:
      power: sensor.halo_wallbox_connector_1_power
      threshold: 300
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.halo_wallbox_connector_1
      - action: logbook.log
        data:
          name: Smart EQ P0
          message: "Halo freigegeben, warte auf Ladeleistung"
      - wait_template: "{{ states(power) | float(0) > threshold }}"
        timeout: "{{ states('input_number.smart_eq_p0_start_wait') | int(120) }}"
      - if:
          - condition: template
            value_template: "{{ states(power) | float(0) > threshold }}"
        then:
          - action: logbook.log
            data:
              name: Smart EQ P0
              message: "Ladung ohne Wakeup gestartet"
          - stop: "Lädt"
      - if:
          - condition: state
            entity_id: input_boolean.smart_eq_p0_cp_wakeup
            state: "off"
        then:
          - action: notify.DEIN_HANDY
            data:
              title: "Smart EQ: Ladestart fehlgeschlagen"
              message: "Keine Ladeleistung, CP-Wakeup ist gesperrt."
              data:
                push:
                  interruption-level: time-sensitive
          - stop: "Kein Wakeup erlaubt"
      - action: script.smart_eq_cp_pulse_test
      - wait_template: "{{ states(power) | float(0) > threshold }}"
        timeout: "{{ states('input_number.smart_eq_p0_post_cp_wait') | int(90) }}"
      - if:
          - condition: template
            value_template: "{{ states(power) | float(0) > threshold }}"
        then:
          - action: logbook.log
            data:
              name: Smart EQ P0
              message: "Ladung nach CP-Puls gestartet"
        else:
          - action: notify.DEIN_HANDY
            data:
              title: "Smart EQ: Ladestart fehlgeschlagen"
              message: "Auch nach dem CP-Puls keine Ladeleistung. Shelly und Auto prüfen."
              data:
                push:
                  interruption-level: time-sensitive

  smart_eq_cp_pulse_test:
    alias: "Smart EQ: CP-Puls (10 s) mit Rückstellprüfung"
    icon: mdi:pulse
    mode: single
    sequence:
      - action: logbook.log
        data:
          name: Smart EQ Messung
          message: "CP-Puls gestartet"
      - action: rest_command.smart_eq_cp_pulse
        data:
          seconds: 10
      - delay: 15
      - if:
          - condition: state
            entity_id: switch.mini_1_wallbox_wallbox_cp_unterbrechung
            state: "on"
        then:
          - action: logbook.log
            data:
              name: Smart EQ Messung
              message: "CP nach Puls wieder geschlossen"
        else:
          - action: switch.turn_on
            target:
              entity_id: switch.mini_1_wallbox_wallbox_cp_unterbrechung
          - action: notify.DEIN_HANDY
            data:
              title: "Smart EQ: CP nicht zurückgestellt!"
              message: "Shelly-Relais nach dem Puls nicht ON – sofort prüfen."
              data:
                push:
                  interruption-level: critical

automation:
  - id: smart_eq_p0_charge_window_start
    alias: "Smart EQ P0: Nachtladung starten"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.smart_eq_p0_start
    conditions:
      - condition: state
        entity_id: input_boolean.smart_eq_p0_enabled
        state: "on"
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
      - condition: state
        entity_id: binary_sensor.halo_wallbox_connector_1_cable_connected
        state: "on"
    actions:
      - action: script.smart_eq_p0_start_charge

  - id: smart_eq_p0_charge_window_end
    alias: "Smart EQ P0: Halo morgens aus"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.smart_eq_p0_end
    conditions:
      - condition: state
        entity_id: input_boolean.smart_eq_p0_enabled
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.halo_wallbox_connector_1
      - action: logbook.log
        data:
          name: Smart EQ P0
          message: "Halo ausgeschaltet (morgens)"

  - id: smart_eq_p0_plug_reminder
    alias: "Smart EQ P0: Abends nicht eingesteckt"
    mode: single
    triggers:
      - trigger: time
        at: "21:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.smart_eq_p0_enabled
        state: "on"
      - condition: time
        weekday: [sun, mon, tue, wed, thu]
      - condition: state
        entity_id: binary_sensor.halo_wallbox_connector_1_cable_connected
        state: "off"
    actions:
      - action: notify.DEIN_HANDY
        data:
          title: "Smart EQ nicht eingesteckt"
          message: "Für heute Nacht ist Laden geplant, aber das Kabel steckt nicht."

  # Messprotokoll: jeder Halo-/Shelly-Wechsel mit Zeitstempel ins Logbuch –
  # Poll-Intervall, Schaltlatenz und alle status_raw-Werte (§16 Fragen 1–4).
  - id: smart_eq_p0_measure_halo
    alias: "Smart EQ P0: Messprotokoll"
    mode: queued
    max: 50
    triggers:
      - trigger: state
        entity_id:
          - switch.halo_wallbox_connector_1
          - binary_sensor.halo_wallbox_connector_1_cable_connected
          - sensor.halo_wallbox_connector_1_status
          - sensor.halo_wallbox_connector_1_power
          - switch.mini_1_wallbox_wallbox_cp_unterbrechung
    actions:
      - action: logbook.log
        data:
          name: Smart EQ Messung
          entity_id: "{{ trigger.entity_id }}"
          message: >-
            {{ trigger.from_state.state if trigger.from_state else '–' }} →
            {{ trigger.to_state.state if trigger.to_state else '–' }}
            ({{ now().isoformat(timespec='seconds') }})
