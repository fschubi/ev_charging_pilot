# Smart EQ Charging Center – Standard-Dashboard aus HA-Bordmitteln (Masterplan §12.5, v0.2)
#
# Einbinden: Einstellungen → Dashboards → Dashboard hinzufügen → „Neu von Grund auf“,
# dann ⋮ → Rohdaten-Konfigurationseditor → diesen Inhalt einfügen.
# Karten für OVMS-Werte (SOC, Klima) erscheinen erst, wenn die Entitäten existieren.
title: Smart EQ
views:
  - title: Cockpit
    path: smart-eq
    icon: mdi:car-electric
    cards:
      - type: tile
        entity: sensor.smart_eq_executor_state
        name: Status
      - type: glance
        title: Überblick
        entities:
          - entity: sensor.smart_eq_soc
          - entity: sensor.smart_eq_charge_power
          - entity: sensor.smart_eq_session_energy
          - entity: sensor.smart_eq_system_health
      - type: entities
        title: Plan und Prognose
        entities:
          - sensor.smart_eq_desired_reason
          - sensor.smart_eq_next_charge_start
          - sensor.smart_eq_next_departure
          - sensor.smart_eq_expected_departure_soc
          - sensor.smart_eq_estimated_finish
          - binary_sensor.smart_eq_charge_plan_feasible
          - binary_sensor.smart_eq_manual_override
          - sensor.smart_eq_last_charge_result
      - type: entities
        title: Bedienung
        entities:
          - switch.smart_eq_automation
          - switch.smart_eq_dry_run
          - select.smart_eq_override_mode
          - time.smart_eq_departure
          - number.smart_eq_minimum_departure_soc
          - number.smart_eq_preferred_departure_soc
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            entity: button.smart_eq_start_charge
            name: Jetzt laden
            icon: mdi:play
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.smart_eq_start_charge}}
          - type: button
            entity: button.smart_eq_stop_charge
            name: Stopp
            icon: mdi:stop
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.smart_eq_stop_charge}}
          - type: button
            entity: button.smart_eq_one_shot_tonight
            name: Heute Nacht
            icon: mdi:weather-night
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.smart_eq_one_shot_tonight}}
          - type: button
            entity: button.smart_eq_climate_10min
            name: Klima 10 min
            icon: mdi:fan
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.smart_eq_climate_10min}}
          - type: button
            entity: button.smart_eq_climate_stop
            name: Klima stopp
            icon: mdi:fan-off
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.smart_eq_climate_stop}}
          - type: button
            entity: button.smart_eq_reset_error
            name: Fehler zurücksetzen
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: button.press
              target: {entity_id: button.smart_eq_reset_error}
              confirmation: {text: "Fehlerzustand zurücksetzen?"}
      - type: history-graph
        title: Ladeleistung und SOC (24 h)
        hours_to_show: 24
        entities:
          - sensor.smart_eq_charge_power
          - sensor.smart_eq_soc
  - title: Hausstrom
    path: smart-eq-energy
    icon: mdi:home-lightning-bolt
    cards:
      - type: entities
        title: Dieser Monat
        entities:
          - sensor.smart_eq_month_home_energy
          - sensor.smart_eq_month_cost
          - sensor.smart_eq_month_external_energy
          - sensor.smart_eq_month_distance
          - sensor.smart_eq_month_cost_per_100km
          - sensor.smart_eq_month_grid_consumption
      - type: entities
        title: Dieses Jahr
        entities:
          - sensor.smart_eq_year_home_energy
          - sensor.smart_eq_year_cost
          - sensor.smart_eq_year_external_energy
          - sensor.smart_eq_year_distance
          - sensor.smart_eq_year_cost_per_100km
          - sensor.smart_eq_year_grid_consumption
      - type: statistics-graph
        title: Heimladen pro Monat
        entities: [sensor.smart_eq_home_energy_total]
        stat_types: [change]
        period: month
        chart_type: bar
        days_to_show: 365
  - title: Diagnose
    path: smart-eq-diagnose
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Gesundheit
        entities:
          - sensor.smart_eq_system_health
          - binary_sensor.smart_eq_charge_problem
          - binary_sensor.smart_eq_cp_failsafe_ok
          - binary_sensor.smart_eq_charger_available
          - binary_sensor.smart_eq_vehicle_available
          - binary_sensor.smart_eq_data_conflict
          - binary_sensor.smart_eq_soc_stale
          - binary_sensor.smart_eq_hvcycle_warning
          - sensor.smart_eq_hv_contactor_cycles
          - sensor.smart_eq_last_event
      - type: logbook
        title: Ereignisse
        hours_to_show: 48
        entities:
          - sensor.smart_eq_executor_state
          - sensor.smart_eq_last_event
